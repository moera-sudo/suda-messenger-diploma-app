name: messenger_app_v2
description: "A web3 mobile messenger"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  connectivity_plus: ^6.1.5
  convert: ^3.1.2
  crypto: ^3.0.7
  dartz: ^0.10.1
  device_info_plus: ^12.3.0
  dio: ^5.9.1
  encrypt: ^5.0.3
  equatable: ^2.0.8
  audio_waveforms: ^1.2.0
  chewie: ^1.8.5
  file_picker: ^10.3.10
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flame: ^1.22.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^20.0.0
  flutter_contacts: ^1.1.9+2
  flutter_localization: ^0.3.3
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.0
  go_router: ^17.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image_picker: ^1.2.1
  injectable: ^2.7.1+4
  intl: ^0.20.2
  json_annotation: ^4.10.0
  jwt_decoder: ^2.0.1
  logger: ^2.6.2
  open_file: ^3.5.11
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  photo_manager: ^3.9.0
  photo_view: ^0.15.0
  pretty_dio_logger: ^1.4.0
  reown_walletkit: ^1.2.0
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  stream_transform: ^2.1.1
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  video_player: ^2.9.2
  web3dart: ^2.7.3
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.13.1
  wechat_assets_picker: ^9.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  injectable_generator: ^2.9.0
  build_runner: ^2.9.0
  json_serializable: ^6.12.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.7

flutter_native_splash:
  color: "#0f1020" # Фоновый цвет экрана
  image: assets/app/intro.png # Путь к изображению
  
  # Настройки для Android 12 и выше
  android_12:
    image: assets/app/intro.png
    icon_background_color: "#ffffff"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app/logo.png"
  adaptive_icon_background: "assets/app/logo_background.png"
  adaptive_icon_foreground: "assets/app/logo_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

