      tags:
      - Auth
  /auth/webapp-session:
    post:
      consumes:
      - application/json
      description: |-
        Called by WebView mini-apps (Wallet / Marketplace) on load.
        The SPA reads `?initData=...` from its URL and posts it here;
        backend validates HMAC + auth_date and returns an access JWT
        (no refresh token — when it expires the SPA re-runs this
        endpoint with the same initData, or the host app reopens the
        WebView with a fresh one).
      parameters:
      - description: Init data string from URL
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_moera-sudo_backend_backend_messenger-service_internal_features_auth.WebappSessionReq'
      produces:
      - application/json
      responses:
