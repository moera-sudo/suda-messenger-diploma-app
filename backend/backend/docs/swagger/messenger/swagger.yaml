        "400":
          description: INVALID_INIT_DATA | INIT_DATA_EXPIRED | VALIDATION_ERROR
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_messenger-service_internal_pkg_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_messenger-service_internal_pkg_http.ErrorResponse'
      summary: Exchange Mini App init_data for a short-lived access JWT
      tags:
      - Auth
