        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a presigned URL for inline viewing
      tags:
      - Media
  /api/media/upload/init:
    post:
      consumes:
      - application/json
      parameters:
      - description: Upload parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_domain_models.InitUploadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_domain_models.InitUploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Initialize a file upload and get presigned URL
      tags:
      - Media
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
