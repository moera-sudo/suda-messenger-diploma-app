host: localhost:8084
info:
  contact: {}
  description: REST API for file upload, download and management via S3 presigned
    URLs.
  title: Suda Media Service API
  version: "1.0"
paths:
  /api/media/{id}:
    delete:
      parameters:
      - description: Media ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a media file
      tags:
      - Media
    get:
      parameters:
      - description: Media ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_domain_models.MediaMetadata'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get media file metadata
      tags:
      - Media
  /api/media/{id}/confirm:
    post:
      parameters:
      - description: Media ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_domain_models.ConfirmUploadResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm that file was uploaded to S3
      tags:
      - Media
  /api/media/{id}/download-url:
    get:
      parameters:
      - description: Media ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_domain_models.GetURLResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
        "403":
