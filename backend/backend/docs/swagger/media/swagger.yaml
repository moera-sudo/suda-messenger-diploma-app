      security:
      - BearerAuth: []
      summary: Get a presigned URL for downloading
      tags:
      - Media
  /api/media/{id}/link:
    post:
      consumes:
      - application/json
      parameters:
      - description: Media ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: entity_type and entity_id
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.MessageRespond'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_moera-sudo_backend_backend_media-service_internal_pkg_http.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Link media to an entity (message, chat avatar, etc.)
      tags:
      - Media
  /api/media/{id}/url:
    get:
      parameters:
      - description: Media ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
