# Upstream = backend-пул куда проксировать. Имена docker-сервисов
# (api-gateway, messenger-service) резолвятся в Docker DNS на private IP контейнера.
upstream gateway_upstream { server api-gateway:8080; }

# Главный server-block — слушает :80 на всех интерфейсах
server {
    listen 80 default_server;
    server_name _;                # принимаем запросы на любой хост (включая ZeroTier IP)
    client_max_body_size 50M;     # лимит на upload (для media-сервиса)

    # Docker's embedded DNS. Без него nginx резолвит хосты в proxy_pass ОДИН раз
    # при старте и кеширует IP — после рестарта апстрима (новый IP контейнера)
    # это даёт 502. С resolver + переменной в proxy_pass nginx ре-резолвит имя
    # на каждый запрос.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Backend API ──
    # Любой /api/... → пробрасывается в api-gateway
    location /api/ {
        proxy_pass http://gateway_upstream;
        # Стандартные proxy headers — gateway видит реальный IP клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket ──
    # WS отдельным location'ом потому что нужен Upgrade-header.
    # Сразу прокси на messenger-service:8081/ws (не через gateway), потому что в браузере
    # WebSocket API не позволяет ставить кастомные headers — клиент передаёт JWT через
    # `?token=<jwt>`, который hub.go валидирует сам. Сравниваем оба пути (`/ws` и `/ws/`).
    # proxy_pass через переменную ($msg) — заставляет nginx ре-резолвить имя
    # через resolver на каждый запрос (иначе кеширует IP со старта → 502 после
    # рестарта messenger). $is_args$args сохраняет ?token=<jwt>.
    location = /ws  { set $msg messenger-service:8081; proxy_pass http://$msg/ws$is_args$args; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400; }
    location = /ws/ { set $msg messenger-service:8081; proxy_pass http://$msg/ws$is_args$args; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 86400; }

    # ── Swagger UI (для frontend разработчиков) ──
    # Идём напрямую в сервисы, минуя gateway-signature middleware
    location /swagger/messenger/ {
        proxy_pass http://messenger-service:8081/swagger/;
    }
    location /swagger/transaction/ {
        proxy_pass http://transaction-service:8082/swagger/;
    }

    # ── MinIO (S3) buckets ──
    # Presigned URLs point at this nginx (:80), not at MinIO:9000 directly (which
    # isn't reachable over the VPN). media-service signs them for the client's own
    # host; we just forward Host unchanged so the SigV4 signature validates.
    # Buckets: avatars, media (see media-service bucketForKind).
    location ~ ^/(avatars|media)/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        client_max_body_size 50M;     # presigned PUT (upload) goes here too
    }

    # ── Wallet WebView SPA ──
    location /wallet/ {
        proxy_pass http://wallet-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Landing ──
    # На `/` пока ничего нет, через Итерацию 3 будет редирект на /admin/
    location = / {
        return 200 "Suda backend is up.\nAPI: /api/v1/...\nSwagger: /swagger/messenger/ | /swagger/transaction/\n";
        add_header Content-Type text/plain;
    }
}
