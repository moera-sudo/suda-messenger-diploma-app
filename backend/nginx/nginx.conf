# Master process runs as 'nginx' user (uid 101 in alpine image)
user nginx;
# Auto = столько процессов сколько CPU cores
worker_processes auto;

# Логи об ошибках самого nginx (не запросов)
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Сколько одновременных connections на worker
    worker_connections 1024;
}

http {
    # MIME-types берутся из этого файла (text/html, application/json, ...)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Формат access-лога (один запрос = одна строка)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Подгрузить все site-configs из conf.d/
    include /etc/nginx/conf.d/*.conf;
}
