http:
  method: PUT
  url: "{{base_url}}{{messenger_prefix}}/channels/comments/{{test_comment_id}}"
  body:
    type: json
    data: |-
      {
        "text": "Updated comment text"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
