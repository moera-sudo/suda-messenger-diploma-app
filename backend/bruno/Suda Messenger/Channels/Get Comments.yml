info:
  name: Get Comments
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/channels/{{test_channel_id}}/posts/{{test_message_id}}/comments"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has comments array", function() {
          expect(res.getBody().comments).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
