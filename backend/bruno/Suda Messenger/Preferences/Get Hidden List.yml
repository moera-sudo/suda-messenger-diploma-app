info:
  name: Get Hidden List
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/last-seen-hidden"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has hidden array", function() {
          expect(res.getBody().hidden).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
