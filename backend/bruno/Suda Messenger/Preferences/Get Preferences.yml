info:
  name: Get Preferences
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/preferences"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has preferences object", function() {
          expect(res.getBody()).to.be.an("object");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
