info:
  name: Update Preferences
  type: http
  seq: 2

http:
  method: PUT
  url: "{{base_url}}{{messenger_prefix}}/preferences"
  body:
    type: json
    data: |-
      {
        "notifications_enabled": true,
        "language": "en"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
