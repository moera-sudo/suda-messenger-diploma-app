info:
  name: Hide Last Seen
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/last-seen-hidden"
  body:
    type: json
    data: |-
      {
        "hidden_user_id": "{{test_user_id_2}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 or 201", function() {
          expect([200, 201]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
