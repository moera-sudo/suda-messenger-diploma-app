info:
  name: Global Search
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/search?q=snoopdog"
  params:
    - name: q
      value: snoopdog
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Has users array", function() {
          expect(res.getBody().users).to.be.an("array");
        });

        test("Has chats array", function() {
          expect(res.getBody().chats).to.be.an("array");
        });

        test("Has messages array", function() {
          expect(res.getBody().messages).to.be.an("array");
        });

        test("User results have required fields", function() {
          if (res.getBody().users.length > 0) {
            const u = res.getBody().users[0];
            expect(u).to.have.property("type");
            expect(u).to.have.property("id");
            expect(u).to.have.property("title");
            expect(u).to.have.property("rank");
            expect(u.type).to.equal("USER");
          }
        });

        test("Message results have highlight", function() {
          if (res.getBody().messages.length > 0) {
            const m = res.getBody().messages[0];
            expect(m).to.have.property("highlight");
            expect(m).to.have.property("chat_id");
            expect(m).to.have.property("message_id");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
