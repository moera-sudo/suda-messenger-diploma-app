info:
  name: Search Short Query
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/search?q=a"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns empty results for short query", function() {
          expect(res.getBody().users).to.be.an("array").that.is.empty;
          expect(res.getBody().chats).to.be.an("array").that.is.empty;
          expect(res.getBody().messages).to.be.an("array").that.is.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
