info:
  name: Create Pin
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/user/pins"
  body:
    type: json
    data: |-
      {
        "chat_id": "{{test_chat_id}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("test_pin_id", res.getBody().id);
        }
    - type: tests
      code: |-
        test("Status is 201", function() {
          expect(res.getStatus()).to.equal(201);
        });
        test("Has pin id", function() {
          expect(res.getBody().id).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
