info:
  name: Reorder Pins
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}{{messenger_prefix}}/user/pins/reorder"
  body:
    type: json
    data: |-
      {
        "pin_ids": ["{{test_pin_id}}"]
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
