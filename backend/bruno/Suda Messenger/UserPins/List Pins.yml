info:
  name: List Pins
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/user/pins"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has pins array", function() {
          expect(res.getBody().pins).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
