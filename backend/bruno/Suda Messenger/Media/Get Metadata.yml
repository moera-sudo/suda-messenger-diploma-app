info:
  name: Get Metadata
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}{{media_prefix}}/{{test_media_id}}"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("ID matches", function() {
          expect(res.getBody().id).to.equal(bru.getEnvVar("test_media_id"));
        });

        test("Kind is ATTACHMENT", function() {
          expect(res.getBody().kind).to.equal("ATTACHMENT");
        });

        test("Content type is image/jpeg", function() {
          expect(res.getBody().content_type).to.equal("image/jpeg");
        });

        test("Status is READY", function() {
          expect(res.getBody().status).to.equal("READY");
        });

        test("Original name preserved", function() {
          expect(res.getBody().original_name).to.equal("test_image.jpg");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
