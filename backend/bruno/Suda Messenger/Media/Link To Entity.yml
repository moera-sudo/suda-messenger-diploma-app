info:
  name: Link To Entity
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}{{media_prefix}}/{{test_media_id}}/link"
  body:
    type: json
    data: |-
      {
        "entity_type": "USER_AVATAR",
        "entity_id": "{{test_user_id}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Action is LINKED", function() {
          expect(res.getBody().action).to.equal("LINKED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
