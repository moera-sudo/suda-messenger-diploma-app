info:
  name: Upload Wrong ContentType
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}{{media_prefix}}/upload/init"
  body:
    type: json
    data: |-
      {
        "kind": "AVATAR",
        "content_type": "application/pdf",
        "original_name": "not_an_image.pdf",
        "is_private": false
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 400", function() {
          expect(res.getStatus()).to.equal(400);
        });

        test("Error mentions not allowed", function() {
          expect(res.getBody().message).to.include("not allowed");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
