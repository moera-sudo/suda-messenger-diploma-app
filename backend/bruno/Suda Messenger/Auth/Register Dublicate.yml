info:
  name: Register Dublicate
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "@unique_user_999",
        "name": "Duplicate Test",
        "email": "{{test_email}}",
        "password": "{{test_password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 409", function() {
          expect(res.getStatus()).to.equal(409);
        });

        test("Error indicates duplicate", function() {
          const code = res.getBody().error;
          expect(["EMAIL_TAKEN", "USER_CREDENTIALS_TAKEN", "USER_EXISTS"]).to.include(code);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
