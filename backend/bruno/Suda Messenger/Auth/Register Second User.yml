info:
  name: Register Second User
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "{{test_username_2}}",
        "name": "{{test_display_name_2}}",
        "email": "{{test_email_2}}",
        "password": "{{test_password_2}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 201 or 409", function() {
          expect([201, 409]).to.include(res.getStatus());
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
