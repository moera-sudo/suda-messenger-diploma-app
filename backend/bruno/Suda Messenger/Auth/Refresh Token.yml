info:
  name: Refresh Token
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token":"{{refresh_token}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("access_token", res.getBody().access_token);
          if (res.getBody().refresh_token) {
            bru.setEnvVar("refresh_token", res.getBody().refresh_token);
          }
        }
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns new access_token", function() {
          expect(res.getBody().access_token).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
