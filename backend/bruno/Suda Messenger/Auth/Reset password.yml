info:
  name: Reset password
  type: http
  seq: 9

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "{{test_email}}",
        "code": "123456",
        "password": "{{test_password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Action is RESET_PASSWORD", function() {
          expect(res.getBody().action).to.equal("RESET_PASSWORD");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
