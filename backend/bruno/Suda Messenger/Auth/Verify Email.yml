info:
  name: Verify Email
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/auth/verify"
  body:
    type: json
    data: |-
      {
        "email": "{{test_email}}",
        "code": "925757"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Action is EMAIL_VERIFIED", function() {
          expect(res.getBody().action).to.equal("EMAIL_VERIFIED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
