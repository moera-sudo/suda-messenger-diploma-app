info:
  name: Forgot Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email":"{{test_email}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Action is REQUEST_ON_PASS_RESET", function() {
          expect(res.getBody().action).to.equal("REQUEST_ON_PASS_RESET");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
