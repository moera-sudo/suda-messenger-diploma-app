info:
  name: gateway-health
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/health"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Body has status ok", function() {
          expect(res.getBody().status).to.equal("ok");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
