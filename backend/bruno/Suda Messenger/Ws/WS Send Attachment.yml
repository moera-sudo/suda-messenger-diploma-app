info:
  name: WS Send Attachment
  type: websocket
  seq: 6

websocket:
  url: "ws://localhost:8080/api/v1/messenger/ws?token={{access_token}}"
  message:
    type: json
    data: |-
      {
        "type": "SEND_MESSAGE",
        "payload": {
          "chat_id": "{{test_direct_chat_id}}",
          "content": "",
          "type": "IMAGE",
          "attachment_media_id": "{{test_media_id}}",
          "client_side_id": "ws-att-001"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Receives NEW_MESSAGE event", function() {
          const msg = JSON.parse(res.getMessage());
          expect(msg.type).to.equal("NEW_MESSAGE");
        });

        test("Has attachment_media_id", function() {
          const msg = JSON.parse(res.getMessage());
          expect(msg.payload.attachment_media_id).to.equal(bru.getEnvVar("test_media_id"));
        });

        test("Type is IMAGE", function() {
          const msg = JSON.parse(res.getMessage());
          expect(msg.payload.type).to.equal("IMAGE");
        });

settings:
  timeout: 5000
