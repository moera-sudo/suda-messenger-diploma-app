runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("test_direct_chat_id", res.getBody().id);
          bru.setEnvVar("test_chat_id", res.getBody().id);
        }
    - type: tests
      code: |-
        test("Status is 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("Chat type is DIRECT", function() {
          expect(res.getBody().type).to.equal("DIRECT");
        });

        test("Has chat ID", function() {
          expect(res.getBody().id).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
