info:
  name: Mute and Unmute Chat
  type: http
  seq: 20

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/chats/{{test_direct_chat_id}}/mute"
  body:
    type: json
    data: |-
      {}
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Action is CHAT_MUTED", function() {
          expect(res.getBody().action).to.equal("CHAT_MUTED");
        });
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar("base_url");
        const prefix = bru.getEnvVar("messenger_prefix");
        const token = bru.getEnvVar("access_token");
        const chatId = bru.getEnvVar("test_direct_chat_id");

        const res2 = await fetch(baseUrl + prefix + "/chats/" + chatId + "/unmute", {
          method: "POST",
          headers: { "Authorization": "Bearer " + token }
        });

        if (res2.status === 200) {
          console.log("✅ Unmute OK");
        } else {
          console.log("❌ Unmute failed: " + res2.status);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
