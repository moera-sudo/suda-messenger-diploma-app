info:
  name: Create Direct Chat Idempotent
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/chats"
  body:
    type: json
    data: |-
      {
        "type": "DIRECT",
        "target_id": "{{test_user_id_2}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("Returns same chat ID (no duplicates)", function() {
          expect(res.getBody().id).to.equal(bru.getEnvVar("test_direct_chat_id"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
