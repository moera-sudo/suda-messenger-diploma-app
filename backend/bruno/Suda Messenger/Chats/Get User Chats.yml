info:
  name: Get User Chats
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/chats"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns array", function() {
          expect(res.getBody()).to.be.an("array");
        });

        test("Has at least one chat", function() {
          expect(res.getBody().length).to.be.greaterThan(0);
        });

        test("Each chat has required fields", function() {
          const chat = res.getBody()[0];
          expect(chat.id).to.be.a("string");
          expect(chat.type).to.be.a("string");
          expect(["DIRECT", "GROUP", "SAVED"]).to.include(chat.type);
          expect(chat).to.have.property("last_message_content");
          expect(chat).to.have.property("unread_count");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
