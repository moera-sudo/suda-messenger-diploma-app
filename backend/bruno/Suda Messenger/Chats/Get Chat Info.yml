info:
  name: Get Chat Info
  type: http
  seq: 18

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/chats/{{test_group_chat_id}}/info"
  body:
    type: none
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Has members array", function() {
          expect(res.getBody().members).to.be.an("array");
        });

        test("Has member_count", function() {
          expect(res.getBody().member_count).to.be.greaterThan(0);
        });

        test("Members have required fields", function() {
          const m = res.getBody().members[0];
          expect(m).to.have.property("user_id");
          expect(m).to.have.property("username");
          expect(m).to.have.property("role");
          expect(m).to.have.property("is_online");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
