info:
  name: Get Messages Pagination
  type: http
  seq: 11

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/chats/{{test_direct_chat_id}}/messages?limit=1&offset=0"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns exactly 1 message", function() {
          expect(res.getBody()).to.be.an("array");
          expect(res.getBody().length).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
