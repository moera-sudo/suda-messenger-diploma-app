info:
  name: Pin and Unpin Message
  type: http
  seq: 19

http:
  method: POST
  url: "{{base_url}}{{messenger_prefix}}/chats/{{test_group_chat_id}}/pin"
  body:
    type: json
    data: |-
      {
        "message_id": {{test_message_id}}
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Action is MESSAGE_PINNED", function() {
          expect(res.getBody().action).to.equal("MESSAGE_PINNED");
        });
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar("base_url");
        const prefix = bru.getEnvVar("messenger_prefix");
        const token = bru.getEnvVar("access_token");
        const groupId = bru.getEnvVar("test_group_chat_id");
        const msgId = bru.getEnvVar("test_message_id");

        const res2 = await fetch(baseUrl + prefix + "/chats/" + groupId + "/pin/" + msgId, {
          method: "DELETE",
          headers: { "Authorization": "Bearer " + token }
        });

        if (res2.status === 200) {
          console.log("✅ Unpin OK");
        } else {
          console.log("❌ Unpin failed: " + res2.status);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
