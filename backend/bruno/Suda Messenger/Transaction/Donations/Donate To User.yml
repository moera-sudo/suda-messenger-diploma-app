info:
  name: Donate To User
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}{{transaction_prefix}}/donate"
  body:
    type: json
    data: |-
      {
        "to_username": "{{test_username_2}}",
        "amount_wei": "1000000000000000000",
        "message": "Thanks for everything!",
        "chat_id": "{{test_chat_id}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 202", function() {
          expect(res.getStatus()).to.equal(202);
        });
        test("Has tx_hash", function() {
          expect(res.getBody().tx_hash).to.be.a("string");
          expect(res.getBody().tx_hash).to.match(/^0x/);
        });
        test("Is not channel donation", function() {
          expect(res.getBody().is_channel).to.equal(false);
        });
        test("Has to_user_id", function() {
          expect(res.getBody().to_user_id).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
