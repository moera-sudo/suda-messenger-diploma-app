info:
  name: Create Rule
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}{{transaction_prefix}}/gating/rule"
  body:
    type: json
    data: |-
      {
        "chat_id": "{{test_channel_id}}",
        "min_suda_balance_wei": "100000000000000000000"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has action", function() {
          expect(res.getBody().action).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
