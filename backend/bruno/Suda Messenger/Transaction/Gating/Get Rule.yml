info:
  name: Get Rule
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}{{transaction_prefix}}/gating/rule/{{test_channel_id}}"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has has_rule field", function() {
          expect(res.getBody()).to.have.property("has_rule");
        });
        test("Has min_suda_balance_wei", function() {
          expect(res.getBody().min_suda_balance_wei).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
