info:
  name: Get Channel Donations
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}{{transaction_prefix}}/wallet/channel/{{test_channel_id}}/donations?limit=10&offset=0"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has items array", function() {
          expect(res.getBody().items).to.be.an("array");
        });
        test("Has total", function() {
          expect(res.getBody().total).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
