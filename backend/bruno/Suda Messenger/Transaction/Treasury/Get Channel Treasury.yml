info:
  name: Get Channel Treasury
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}{{transaction_prefix}}/wallet/channel/{{test_channel_id}}/treasury"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has channel_id", function() {
          expect(res.getBody().channel_id).to.be.a("string");
        });
        test("Has suda_balance_wei", function() {
          expect(res.getBody().suda_balance_wei).to.be.a("string");
        });
        test("Has total_donations_count", function() {
          expect(res.getBody().total_donations_count).to.be.a("number");
        });
        test("Has top_donors array", function() {
          expect(res.getBody().top_donors).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
