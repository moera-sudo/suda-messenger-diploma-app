info:
  name: Resolve Username
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}{{transaction_prefix}}/wallet/resolve"
  body:
    type: json
    data: |-
      {
        "username": "{{test_username_2}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Has found field", function() {
          expect(res.getBody()).to.have.property("found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
