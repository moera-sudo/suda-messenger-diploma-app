info:
  name: Transfer
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}{{transaction_prefix}}/wallet/transfer"
  body:
    type: json
    data: |-
      {
        "to_username": "{{test_username_2}}",
        "amount_wei": "1000000000000000000",
        "chat_id": "{{test_chat_id}}"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 202", function() {
          expect(res.getStatus()).to.equal(202);
        });
        test("Has tx_hash", function() {
          expect(res.getBody().tx_hash).to.be.a("string");
          expect(res.getBody().tx_hash).to.match(/^0x/);
        });
        test("Has amount_wei", function() {
          expect(res.getBody().amount_wei).to.equal("1000000000000000000");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
