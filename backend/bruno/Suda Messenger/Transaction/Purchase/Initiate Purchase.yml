info:
  name: Initiate Purchase
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}{{transaction_prefix}}/purchase/initiate"
  body:
    type: json
    data: |-
      {
        "package_code": "MEDIUM",
        "payment_method": "CARD"
      }
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setEnvVar("test_purchase_id", res.getBody().purchase_id);
        }
    - type: tests
      code: |-
        test("Status is 201", function() {
          expect(res.getStatus()).to.equal(201);
        });
        test("Has purchase_id", function() {
          expect(res.getBody().purchase_id).to.be.a("string");
        });
        test("Status is PENDING", function() {
          expect(res.getBody().status).to.equal("PENDING");
        });
        test("Has fiat_amount", function() {
          expect(res.getBody().fiat_amount).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
