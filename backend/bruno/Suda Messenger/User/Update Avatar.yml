info:
  name: Update Avatar
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}{{messenger_prefix}}/user/avatar"
  body:
    type: json
    data: |-
      {
        "media_id": "{{test_media_id}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Action is AVATAR_UPDATED", function() {
          expect(res.getBody().action).to.equal("AVATAR_UPDATED");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
