info:
  name: Profile Returns 403 When Blocked
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/user/id/{{test_user_id_2}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseUrl = bru.getEnvVar("base_url");
        const prefix = bru.getEnvVar("messenger_prefix");
        const token = bru.getEnvVar("access_token");
        const userId2 = bru.getEnvVar("test_user_id_2");

        await fetch(baseUrl + prefix + "/users/block", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ user_id: userId2 })
        });
    - type: tests
      code: |-
        test("Status is 403", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("Error is FORBIDDEN", function() {
          expect(res.getBody().error).to.equal("FORBIDDEN");
        });
    - type: after-response
      code: |-
        const baseUrl = bru.getEnvVar("base_url");
        const prefix = bru.getEnvVar("messenger_prefix");
        const token = bru.getEnvVar("access_token");
        const userId2 = bru.getEnvVar("test_user_id_2");

        await fetch(baseUrl + prefix + "/users/unblock", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ user_id: userId2 })
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
