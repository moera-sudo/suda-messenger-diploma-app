info:
  name: Get Me
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/user/me"
  auth:
    type: bearer
    token: "{{access_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("test_user_id", res.getBody().id);
        }
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Has user id", function() {
          expect(res.getBody().id).to.be.a("string");
        });

        test("Has username", function() {
          expect(res.getBody().username).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
