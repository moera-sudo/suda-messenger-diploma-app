info:
  name: Get User Status
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}{{messenger_prefix}}/user/id/{{test_user_id_2}}/status"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Has user_id", function() {
          expect(res.getBody().user_id).to.equal(bru.getEnvVar("test_user_id_2"));
        });

        test("Has is_online boolean", function() {
          expect(res.getBody().is_online).to.be.a("boolean");
        });

        test("Offline user has last_seen_at", function() {
          if (!res.getBody().is_online) {
            expect(res.getBody().last_seen_at).to.be.a("string");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
